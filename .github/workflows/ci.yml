name: CI

on:
  push:
    branches: [main, master, features/re-design]
  pull_request:
    branches: [main, master, features/re-design]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PsychologyApp.sln
      - run: dotnet build PsychologyApp.sln -c Debug
      - run: dotnet test PsychologyApp.sln -c Debug --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Coverage summary
        run: reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:TextSummary;JsonSummary" "-assemblyfilters:+PsychologyApp.*;-*Tests*;-PsychologyApp.Testing"
      - name: Enforce minimum line coverage per layer
        shell: pwsh
        run: |
          # Measured 2026-10-06: Application 84.6%, Domain 90.4%, Infrastructure 79.3%, Presentation.Core 82.5%, all instrumented code 84%.
          # The gate sits a few points below, so a drop is caught without failing on noise. Raise it as coverage rises.
          $summary = Get-Content CoverageReport/Summary.json -Raw | ConvertFrom-Json
          $minimums = @{ 'PsychologyApp.Application' = 82; 'PsychologyApp.Domain' = 86; 'PsychologyApp.Infrastructure' = 76; 'PsychologyApp.Presentation.Core' = 75 }
          $failed = $false
          foreach ($name in $minimums.Keys) {
            $assembly = $summary.coverage.assemblies | Where-Object { $_.name -eq $name }
            if (-not $assembly) { Write-Error "No coverage found for $name"; $failed = $true; continue }
            Write-Host "$name line coverage: $($assembly.coverage)% (minimum $($minimums[$name])%)"
            if ($assembly.coverage -lt $minimums[$name]) { Write-Error "$name is below $($minimums[$name])%"; $failed = $true }
          }
          $overall = $summary.summary.linecoverage
          Write-Host "Overall line coverage: $overall%"
          if ($overall -lt 80) { Write-Error "Overall coverage $overall% is below 80%"; $failed = $true }
          if ($failed) { exit 1 }
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
      - run: dotnet build PsychologyApp.Presentation/PsychologyApp.Presentation.csproj -f net10.0-ios
      - run: dotnet build PsychologyApp.Presentation/PsychologyApp.Presentation.csproj -f net10.0-android
      - run: dotnet build PsychologyApp.Presentation/PsychologyApp.Presentation.csproj -f net10.0-android -c Release

  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build core and test projects
        run: |
          for proj in \
            PsychologyApp.Domain/PsychologyApp.Domain.csproj \
            PsychologyApp.Application/PsychologyApp.Application.csproj \
            PsychologyApp.Infrastructure/PsychologyApp.Infrastructure.csproj \
            PsychologyApp.Bootstrap/PsychologyApp.Bootstrap.csproj \
            PsychologyApp.Testing/PsychologyApp.Testing.csproj \
            PsychologyApp.Presentation.Core/PsychologyApp.Presentation.Core.csproj \
            PsychologyApp.Domain.Tests/PsychologyApp.Domain.Tests.csproj \
            PsychologyApp.Application.Tests/PsychologyApp.Application.Tests.csproj \
            PsychologyApp.Infrastructure.Tests/PsychologyApp.Infrastructure.Tests.csproj \
            PsychologyApp.Integration.Tests/PsychologyApp.Integration.Tests.csproj \
            PsychologyApp.Presentation.Tests/PsychologyApp.Presentation.Tests.csproj
          do
            dotnet build "$proj" -c Debug -p:Net10Only=true
          done
      - name: Run tests
        run: |
          for proj in \
            PsychologyApp.Domain.Tests/PsychologyApp.Domain.Tests.csproj \
            PsychologyApp.Application.Tests/PsychologyApp.Application.Tests.csproj \
            PsychologyApp.Infrastructure.Tests/PsychologyApp.Infrastructure.Tests.csproj \
            PsychologyApp.Integration.Tests/PsychologyApp.Integration.Tests.csproj \
            PsychologyApp.Presentation.Tests/PsychologyApp.Presentation.Tests.csproj
          do
            dotnet test "$proj" -c Debug --no-build -p:Net10Only=true --verbosity minimal
          done
