name: android-smoke

# Builds the Release package (AOT, trimming, R8) and runs it on an emulator: the crashes that only exist in Release
# (see CHANGELOG, "profiled AOT") are invisible to unit tests.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 2"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: dotnet workload install maui-android
      - name: Build Release APK (x86_64 for the emulator)
        run: >
          dotnet publish PsychologyApp.Presentation/PsychologyApp.Presentation.csproj -f net10.0-android -c Release
          -p:RuntimeIdentifier=android-x64 -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
          -p:AndroidKeyStore=false -o out
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash tools/android-smoke.sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            logcat.txt
            start.txt
