version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      test-tooling:
        patterns: ["xunit*", "Moq", "coverlet*", "Microsoft.NET.Test.Sdk", "FsCheck*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
